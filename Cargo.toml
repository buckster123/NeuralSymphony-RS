[workspace]
resolver = "2"
members = ["ns-core", "ns-midi", "ns-score", "ns-synth", "ns-cerebro", "ns-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = "0.5"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
toml = "0.8"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
# The one C-linking dependency in the workspace, and it's deliberate:
# cerebro exposes NO API for its links table, so ns-cerebro reads the
# SQLite file read-only — the same thing cerebro's own analysis tooling
# does. Bundled so builds don't depend on a system libsqlite3.
rusqlite = { version = "0.32", features = ["bundled"] }
fundsp = "0.18"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
