[workspace]
resolver = "2"
members = ["ns-core", "ns-midi", "ns-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midly = "0.5"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
